name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - '.github/analytics/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check website JavaScript
        run: |
          node --check website/main.js
          node --check website/analytics.js
          node .github/analytics/test-consent.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
