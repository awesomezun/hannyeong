<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1280,height=800">
<script src="assets/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0} html,body{width:1280px;height:800px;overflow:hidden;background:#f5f5f7;color:#202124;font-family:system-ui,sans-serif}
#root{width:100%;height:100%;position:relative} .clip{position:absolute;inset:0;width:100%;height:100%}
.scene{position:absolute;inset:0;padding:62px 80px;display:flex;flex-direction:column;align-items:center}
.step{font-size:22px;font-weight:650;letter-spacing:.06em;color:#5b5f66;margin-bottom:18px}
h1{font-size:48px;line-height:1.3;letter-spacing:-.045em;font-weight:720;margin-bottom:42px;text-align:center}
.card{background:#fff;border:1px solid #dedee2;border-radius:26px;box-shadow:0 12px 36px #0000000b}
.menu{width:500px;padding:18px;margin-top:8px} .menu-row{display:flex;align-items:center;gap:22px;height:86px;padding:16px 24px;border-radius:15px;font-size:32px;position:relative}
.badge{display:inline-flex;justify-content:center;align-items:center;width:60px;height:44px;border-radius:12px;background:#242527;color:#fff;font-size:31px;font-weight:650;flex:none}
#selected{background:#eaeaf0} #checkmark{margin-left:auto;font-size:32px}
.caption{font-size:25px;line-height:1.5;text-align:center;color:#4e535b;margin-top:34px;max-width:1050px}
.input-card{width:1040px;padding:36px 40px;margin-top:5px}
.label{font-size:22px;font-weight:600;color:#5b5f66;margin-bottom:14px}.typed{display:flex;gap:0;font-size:52px;font-weight:600;letter-spacing:0;min-height:68px;align-items:center}
.char{display:block;min-width:30px;text-align:center}.space{min-width:28px}.divider{height:1px;background:#e6e6eb;margin:24px 0}
.result{font-size:52px;font-weight:650;line-height:1.3}.key{display:inline-flex;align-items:center;justify-content:center;padding:10px 25px;min-width:120px;height:68px;border:2px solid #9ba0a8;border-bottom-width:5px;border-radius:14px;background:#f4f4f6;font-size:28px;font-weight:650;color:#242527}
.key-row{display:flex;justify-content:center;gap:20px;margin-top:26px}.candidates{width:580px;padding:16px;margin-top:24px}.candidate{height:72px;display:flex;align-items:center;gap:25px;padding:12px 24px;border-radius:12px;font-size:30px}.number{font-size:22px;color:#5b5f66}
#choice{background:#eaeaf0} .small{font-size:21px;color:#5b5f66;margin-top:20px;text-align:center}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="26" data-width="1280" data-height="800">
<section id="choose" class="clip" data-start="0" data-duration="8" data-track-index="0"><div class="scene" id="choose-inner">
<div class="step">1 / 3 · 시작하기</div><h1>입력기 메뉴에서 한녕을 선택하세요.</h1>
<div class="card menu" id="menu-card"><div class="menu-row"><span class="badge">A</span><span>ABC</span></div><div class="menu-row" id="selected"><span class="badge">ㅎ</span><span>한녕</span><span id="checkmark">✓</span></div></div>
<p class="caption">처음 한 번만 선택하면 됩니다.</p></div></section>
<section id="type" class="clip" data-start="8" data-duration="9" data-track-index="0"><div class="scene" id="type-inner">
<div class="step">2 / 3 · 입력하기</div><h1>한영키 없이, 평소처럼 입력하세요.</h1>
<div class="card input-card"><div class="label">입력 키 예시</div><div class="typed" id="typed"><span class="char">d</span><span class="char">k</span><span class="char">s</span><span class="char">s</span><span class="char">u</span><span class="char">d</span><span class="char space"> </span><span class="char">h</span><span class="char">e</span><span class="char">l</span><span class="char">l</span><span class="char">o</span></div><div class="divider"></div><div class="label">변환 결과</div><div class="result" id="result">안녕 hello</div></div>
<div class="key-row"><span class="key" id="space-key">Space</span><span class="key">Enter</span></div><p class="caption">Space 또는 Enter로 한·영을 자동 변환합니다.</p></div></section>
<section id="correct" class="clip" data-start="17" data-duration="9" data-track-index="0"><div class="scene" id="correct-inner">
<div class="step">3 / 3 · 교정하기</div><h1>결과를 바꾸고 싶다면 F8.</h1><span class="key" id="f8-key">F8</span>
<div class="card candidates" id="candidate-card"><div class="candidate"><span class="number">1</span><span>안녕</span></div><div class="candidate" id="choice"><span class="number">2</span><span>dkssud</span><span id="saved-check" style="margin-left:auto">✓</span></div></div>
<p class="caption" id="correction-caption">원하는 후보를 고르면 다음 입력에 반영합니다.</p><p class="small">바로 지정하기: F6 원문 · F7 한글</p></div></section>
</div>
<script>
const tl=gsap.timeline({paused:true});
for(const [id,start] of [["choose-inner",0],["type-inner",8],["correct-inner",17]]){
 tl.fromTo('#'+id,{opacity:0,y:18},{opacity:1,y:0,duration:.5,ease:'power2.out'},start);
}
tl.fromTo('#menu-card',{opacity:0,scale:.96},{opacity:1,scale:1,duration:.65,ease:'power2.out'},.7);
tl.fromTo('#selected',{backgroundColor:'#ffffff'},{backgroundColor:'#eaeaf0',duration:.5},2.5);
tl.fromTo('#checkmark',{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:'back.out(1.2)'},3);
tl.fromTo('#typed .char',{opacity:0,y:6},{opacity:1,y:0,duration:.25,stagger:.15,ease:'power2.out'},8.8);
tl.fromTo('#space-key',{scale:1,backgroundColor:'#f4f4f6'},{scale:.95,backgroundColor:'#e3e5ea',duration:.18,yoyo:true,repeat:1},11.3);
tl.fromTo('#result',{opacity:0,y:8},{opacity:1,y:0,duration:.5},11.9);
tl.fromTo('#f8-key',{scale:1,backgroundColor:'#f4f4f6'},{scale:.95,backgroundColor:'#e3e5ea',duration:.18,yoyo:true,repeat:1},18.3);
tl.fromTo('#candidate-card',{opacity:0,y:12},{opacity:1,y:0,duration:.4},18.9);
tl.fromTo('#choice',{backgroundColor:'#ffffff'},{backgroundColor:'#eaeaf0',duration:.4},20.1);
tl.fromTo('#saved-check',{opacity:0,scale:.7},{opacity:1,scale:1,duration:.4},20.5);
tl.fromTo('#correction-caption',{opacity:0},{opacity:1,duration:.5},21);
window.__timelines['main']=tl;
</script>
</body>
</html>
